                                stroke:#334155;
                                stroke-width:2.5;
                                fill:none;
                                stroke-linecap:round;
                                stroke-linejoin:round;
                            }

                            .thin {
                                stroke:#64748b;
                                stroke-width:1.6;
                                fill:none;
                            }

                                stroke-width:2.2;
                                fill:#f8fafc;
                                fill-opacity:.78;
                            }

                            .liquid {
                                fill:#cbd5e1;
                                stroke:#64748b;
                                stroke-width:1.3;
                            }

                            .solution-blue {

                                stroke-width:1.3;
                            }

                                stroke-width:1.3;
                            }

                            .metal {

                          fill="white"/>

                    ${content}
                </svg>
            `;

            return "data:image/svg+xml;charset=UTF-8," +
                encodeURIComponent(svg);
        }

        function flame(x, y, scale = 1) {
            return `
                <path d="
                    M ${x} ${y}
                    C ${x - 12 * scale} ${y - 18 * scale},
                      ${x + 2 * scale} ${y - 31 * scale},
                      ${x + 9 * scale} ${y - 45 * scale}
                    C ${x + 16 * scale} ${y - 29 * scale},
                      ${x + 31 * scale} ${y - 17 * scale},
                      ${x + 20 * scale} ${y}
                    Z"
                    class="heat"/>
            `;
        }

        /* =========================================================
           Helpers
        ========================================================= */

        function getQuestionImage(question) {
            if (currentLang === 'zh') {
                return question.imageZh || question.image || null;
            }

            return question.imageEn || question.image || null;
        }

        function showModal(message) {
            document.getElementById('modal-msg').innerText = message;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }


        /* =========================================================
           Language Switching
        ========================================================= */

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';

            document.getElementById('lang-toggle-text').innerText =
                currentLang === 'zh' ? 'English' : '中文';

            document.documentElement.lang =
                currentLang === 'zh' ? 'zh-HK' : 'en';

            updateUI();

            if (currentView === 'subtopics') {
                showSubtopicsView();
            } else if (currentView === 'sections') {
                const subtopic = subtopicsData.main.find(
                    item => item.id === currentSubtopicId
                );

                if (subtopic) {
                    showSectionsView(subtopic);
                }
            } else if (currentView === 'range') {
                showRangeView(
                    currentRangeTargetId,
                    currentRangeTitleZh,
                    currentRangeTitleEn
                );
            } else if (currentView === 'quiz') {
                updateQuestionSelector();
                renderQuestion();
            } else if (currentView === 'result') {
                showResults();
            }
        }

        document.getElementById('lang-toggle-btn')
            .addEventListener('click', toggleLanguage);


        /* =========================================================
           UI Update
        ========================================================= */

        function updateUI() {
            const strings = uiStrings[currentLang];

            document.title = strings.appTitle;

            document.getElementById('ui-app-heading').innerText =
                strings.appTitle;

            document.getElementById('ui-select-chapter-label').innerText =
                strings.selectChapter;

            document.getElementById('ui-select-section-label').innerText =
                strings.selectSection;

            document.getElementById('ui-question-label').innerText =
                strings.question;

            const prevText = document.getElementById('ui-prev-text');

            if (prevText) {
                prevText.innerText = strings.prev;
            }

            const nextText = document.getElementById('ui-next-text');

            if (nextText) {
                if (
                    currentView === 'quiz' &&
                    currentQuestions.length > 0 &&
                    currentQuestionIndex === currentQuestions.length - 1
                ) {
                    nextText.innerText = strings.finish;
                } else {
                    nextText.innerText = strings.next;
                }
            }

            document.getElementById('ui-result-title').innerText =
                strings.resultTitle;

            document.getElementById('ui-final-score-label').innerText =
                strings.finalScoreLabel;

            document.getElementById('ui-download-wrong-text').innerText =
                strings.downloadWrong;

            document.getElementById('ui-download-wrong-pdf-text').innerText =
                strings.downloadWrongPDF;

            document.getElementById('ui-wrong-title').innerHTML =
                `<i class="fas fa-times-circle text-rose-500"></i> ${strings.wrongTitle}`;

            document.getElementById('ui-modal-btn').innerText =
                strings.okBtn;

            const uiTitle = document.getElementById('ui-title');

            if (currentView === 'subtopics') {
                uiTitle.innerText = strings.appTitle;
            } else if (currentView === 'sections') {
                const subtopic = subtopicsData.main.find(
                    item => item.id === currentSubtopicId
                );

                if (subtopic) {
                    uiTitle.innerText =
                        currentLang === 'zh'
                            ? subtopic.titleZh
                            : subtopic.titleEn;
                }
            } else if (
                currentView === 'range' ||
                currentView === 'quiz' ||
                currentView === 'result'
            ) {
                uiTitle.innerText =
                    currentLang === 'zh'
                        ? currentRangeTitleZh
                        : currentRangeTitleEn;
            }

            if (currentView === 'sections') {
                const subtopic = subtopicsData.main.find(
                    item => item.id === currentSubtopicId
                );

                if (subtopic) {
                    document.getElementById('section-header-title').innerText =
                        currentLang === 'zh'
                            ? subtopic.titleZh
                            : subtopic.titleEn;
                }
            }

            if (currentView === 'range' && currentRangeTitleZh) {
                document.getElementById('range-header-title').innerText =
                    currentLang === 'zh'
                        ? currentRangeTitleZh
                        : currentRangeTitleEn;
            }
        }


        /* =========================================================
           Data Retrieval
        ========================================================= */

        function getAllQuestionsForTarget(targetId) {
            if (questionsData[targetId]) {
                return questionsData[targetId];
            }

            if (sectionsData[targetId]) {
                let questions = [];

                sectionsData[targetId].forEach(section => {
                    if (questionsData[section.id]) {
                        questions = questions.concat(
                            questionsData[section.id]
                        );
                    }
                });

                return questions;
            }

            return [];
        }

        function getQuestionCount(targetId) {
            return getAllQuestionsForTarget(targetId).length;
        }


        /* =========================================================
           Chapter View
        ========================================================= */

        function showSubtopicsView() {
            currentView = 'subtopics';
            currentSectionId = null;

            document.getElementById('subtopic-view')
                .classList.remove('hidden');

            document.getElementById('section-view')
                .classList.add('hidden');

            document.getElementById('range-view')
                .classList.add('hidden');

            document.getElementById('quiz-view')
                .classList.add('hidden');

            document.getElementById('result-view')
                .classList.add('hidden');

            document.getElementById('back-btn')
                .classList.add('hidden');

            document.getElementById('ui-title').innerText =
                uiStrings[currentLang].appTitle;

            const container =
                document.getElementById('subtopics-container');

            container.innerHTML = '';

            subtopicsData.main.forEach(subtopic => {
                const count = getQuestionCount(subtopic.id);

                const title =
                    currentLang === 'zh'
                        ? subtopic.titleZh
                        : subtopic.titleEn;

                const card = document.createElement('div');

                card.className =
                    'bg-white rounded-xl p-4 border border-slate-200 hover:border-teal-400 hover:shadow-md transition cursor-pointer flex items-center justify-between';

                card.onclick = () => {
                    currentSubtopicId = subtopic.id;

                    if (sectionsData[subtopic.id]) {
                        showSectionsView(subtopic);
                    } else {
                        showRangeView(
                            subtopic.id,
                            subtopic.titleZh,
                            subtopic.titleEn
                        );
                    }
                };

                card.innerHTML = `
                    <div class="font-bold text-slate-700 text-base pr-4">
                        ${title}
                    </div>

                    <div>
                        <span class="bg-teal-50 text-teal-700 text-sm font-semibold px-3 py-1 rounded-full">
                            ${count} ${uiStrings[currentLang].qUnit}
                        </span>
                    </div>
                `;

                container.appendChild(card);
            });
        }

                    ? subtopic.titleZh

        function renderRanges(targetId) {

            container.innerHTML = '';

            const totalQuestions =
                getQuestionCount(targetId);

            if (totalQuestions === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-8 text-slate-400 font-medium">
                        ${uiStrings[currentLang].noQuestions}
                    </div>
                `;

                return;
            }

            const rangeSize = 10;
            const numberOfRanges =
                Math.ceil(totalQuestions / rangeSize);

            const allCard = document.createElement('div');

            allCard.className =
                'bg-white rounded-xl p-4 border border-teal-200 cursor-pointer flex flex-col items-center justify-center hover:bg-teal-50 hover:border-teal-400 transition shadow-sm';

            allCard.onclick = () =>
                startQuiz(targetId, 0, totalQuestions);

            allCard.innerHTML = `
                <i class="fas fa-layer-group text-2xl text-teal-500 mb-2"></i>

                <div class="font-bold text-teal-700 text-center">
                    ${uiStrings[currentLang].allQuestions}
                </div>

                <div class="text-xs text-teal-600 mt-1">
                    ${totalQuestions} ${uiStrings[currentLang].qUnit}
                </div>
            `;

            container.appendChild(allCard);

            for (let index = 0; index < numberOfRanges; index++) {
                const start = index * rangeSize + 1;

                const end = Math.min(
                    (index + 1) * rangeSize,
                    totalQuestions
                );

                const card = document.createElement('div');

                card.className =
                    'bg-white rounded-xl p-4 border border-slate-200 cursor-pointer flex flex-col items-center justify-center hover:bg-slate-50 hover:border-slate-300 transition shadow-sm';

                card.onclick = () =>
                    startQuiz(targetId, start - 1, end);

                card.innerHTML = `
                    <i class="fas fa-list-ol text-2xl text-slate-400 mb-2"></i>

                    <div class="font-bold text-slate-700">
                        Q${start} - Q${end}
                    </div>

                    <div class="text-xs text-slate-500 mt-1">
                        ${end - start + 1} ${uiStrings[currentLang].qUnit}
                    </div>
                `;

                container.appendChild(card);
            }

            const customCard = document.createElement('div');

            customCard.className =
                'col-span-full bg-white rounded-xl p-5 border border-slate-200 mt-2 shadow-sm';

            customCard.innerHTML = `
                <div class="font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-indigo-400"></i>

                    <span>
                        ${uiStrings[currentLang].customRange}
                    </span>

                    (1 - ${totalQuestions})
                </div>

                <div class="flex items-center gap-3">
                    <input type="number"
                           id="custom-start"
                           min="1"
                           max="${totalQuestions}"
                           placeholder="1"
                           class="w-20 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">

                    <span class="text-slate-500">-</span>

                    <input type="number"
                           id="custom-end"
                           min="1"
                           max="${totalQuestions}"
                           placeholder="${totalQuestions}"
                           class="w-20 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">

                    <button onclick="startCustomQuiz('${targetId}', ${totalQuestions})"
                            class="ml-auto px-4 py-2 bg-indigo-500 text-white rounded-lg font-medium hover:bg-indigo-600 transition shadow-sm">
                        ${uiStrings[currentLang].startCustom}
                    </button>
                </div>
            `;

            container.appendChild(customCard);
        }

        function startCustomQuiz(targetId, totalQuestions) {
            let start = parseInt(
                document.getElementById('custom-start').value,
                10
            );

            let end = parseInt(
                document.getElementById('custom-end').value,
                10
            );

            if (Number.isNaN(start)) {
                start = 1;
            }

            if (Number.isNaN(end)) {
                end = totalQuestions;
            }

            if (
                start < 1 ||
                end > totalQuestions ||
                start > end
            ) {
                showModal(uiStrings[currentLang].invalidRange);
                return;
            }

            startQuiz(targetId, start - 1, end);
        }


        /* =========================================================
           Quiz
        ========================================================= */

        function startQuiz(targetId, startIndex, endIndex) {
            const allQuestions =
                getAllQuestionsForTarget(targetId);

            currentQuestions =
                allQuestions.slice(startIndex, endIndex);

            currentGlobalOffset = startIndex;

            if (currentQuestions.length === 0) {
                showModal(uiStrings[currentLang].noQuestions);
                return;
            }

            userAnswers =
                new Array(currentQuestions.length).fill(null);

            currentQuestionIndex = 0;
            score = 0;
            currentView = 'quiz';

            document.getElementById('range-view')
                .classList.add('hidden');

            document.getElementById('quiz-view')
                .classList.remove('hidden');

            document.getElementById('result-view')
                .classList.add('hidden');

            document.getElementById('question-container')
                .classList.remove('hidden');

            document.getElementById('quiz-controls')
                .classList.remove('hidden');

            document.getElementById('ui-title').innerText =
                currentLang === 'zh'
                    ? currentRangeTitleZh
                    : currentRangeTitleEn;

            updateQuestionSelector();
            renderQuestion();
        }

        function updateQuestionSelector() {
            const selector =
                document.getElementById('question-selector');

            selector.innerHTML = '';

            for (
                let index = 0;
                index < currentQuestions.length;
                index++
            ) {
                const option = document.createElement('option');

                option.value = index;
                option.innerText =
                    currentGlobalOffset + index + 1;

                selector.appendChild(option);
            }

            document.getElementById('question-total-text').innerText =
                `/ ${currentGlobalOffset + currentQuestions.length}`;
        }

        function jumpToQuestion(index) {
            currentQuestionIndex = parseInt(index, 10);
            renderQuestion();
        }

        function renderQuestion() {
            const question =
                currentQuestions[currentQuestionIndex];

            if (!question) {
                return;
            }

            const questionText =
                currentLang === 'zh'
                    ? question.questionZh
                    : question.questionEn;

            const options =
                currentLang === 'zh'
                    ? question.optionsZh
                    : question.optionsEn;

            document.getElementById('question-selector').value =
                currentQuestionIndex;

            document.getElementById('question-text').innerText =
                questionText;

            const imageContainer =
                document.getElementById('question-image-container');

            const imageSource =
                getQuestionImage(question);

            if (imageSource) {
                imageContainer.innerHTML = `
                    <img src="${imageSource}"
                         alt="Question diagram"
                         class="max-w-full w-full h-auto rounded-lg border border-slate-200 shadow-sm max-h-80 object-contain">
                `;

                imageContainer.classList.remove('hidden');
            } else {
                imageContainer.innerHTML = '';
                imageContainer.classList.add('hidden');
            }

            const optionsContainer =
                document.getElementById('options-container');

            optionsContainer.innerHTML = '';

            const explanationContainer =
                document.getElementById('explanation-container');

            explanationContainer.innerHTML = '';
            explanationContainer.classList.add('hidden');

            const userAnswer =
                userAnswers[currentQuestionIndex];

            const hasAnswered =
                userAnswer !== null;

            options.forEach((optionText, optionIndex) => {
                const button =
                    document.createElement('button');

                button.className =
                    'option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-teal-400 hover:bg-teal-50 font-medium text-slate-700 flex items-start gap-3 transition';

                const letter =
                    String.fromCharCode(65 + optionIndex);

                let iconHTML = `
                    <span class="flex-shrink-0 w-6 h-6 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-sm font-semibold">
                        ${letter}
                    </span>
                `;

                if (hasAnswered) {
                    button.disabled = true;

                    button.classList.remove(
                        'hover:border-teal-400',
                        'hover:bg-teal-50'
                    );

                    if (optionIndex === question.answer) {
                        button.classList.add('correct');

                        iconHTML = `
                            <span class="flex-shrink-0 w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center">
                                <i class="fas fa-check"></i>
                            </span>
                        `;
                    } else if (optionIndex === userAnswer) {
                        button.classList.add('wrong');

                        iconHTML = `
                            <span class="flex-shrink-0 w-6 h-6 rounded-full bg-red-100 text-red-600 flex items-center justify-center">
                                <i class="fas fa-times"></i>
                            </span>
                        `;
                    } else {
                        button.classList.add('opacity-50');
                    }
                } else {
                    button.onclick = () =>
                        selectOption(optionIndex);
                }

                button.innerHTML = iconHTML;

                const textSpan =
                    document.createElement('span');

                textSpan.innerText = optionText;

                button.appendChild(textSpan);
                optionsContainer.appendChild(button);
            });

            if (
                hasAnswered &&
                userAnswer !== question.answer
            ) {
                const explanation =
                    currentLang === 'zh'
                        ? question.explanationZh
                        : question.explanationEn;

                explanationContainer.innerHTML = `
                    <div class="p-4 bg-sky-50 border border-sky-100 rounded-xl text-sky-800 text-sm mt-4">
                        <div class="font-bold flex items-center gap-2 mb-1">
                            <i class="fas fa-info-circle"></i>
                            ${uiStrings[currentLang].explanation}
                        </div>

                        <div class="whitespace-pre-line leading-relaxed"></div>
                    </div>
                `;

                explanationContainer
                    .querySelector('.whitespace-pre-line')
                    .innerText = explanation;

                explanationContainer.classList.remove('hidden');
            }

            document.getElementById('prev-btn').disabled =
                currentQuestionIndex === 0;

            const nextButton =
                document.getElementById('next-btn');

            const nextText =
                document.getElementById('ui-next-text');

            const nextIcon =
                nextButton.querySelector('i');

            if (
                currentQuestionIndex ===
                currentQuestions.length - 1
            ) {
                nextText.innerText =
                    uiStrings[currentLang].finish;

                nextButton.classList.remove(
                    'bg-teal-500',
                    'hover:bg-teal-600'
                );

                nextButton.classList.add(
                    'bg-indigo-500',
                    'hover:bg-indigo-600'
                );

                if (nextIcon) {
                    nextIcon.className =
                        'fas fa-check ml-1';
                }
            } else {
                nextText.innerText =
                    uiStrings[currentLang].next;

                nextButton.classList.remove(
                    'bg-indigo-500',
                    'hover:bg-indigo-600'
                );

                nextButton.classList.add(
                    'bg-teal-500',
                    'hover:bg-teal-600'
                );

                if (nextIcon) {
                    nextIcon.className =
                        'fas fa-chevron-right ml-1';
                }
            }
        }

        function selectOption(index) {
            if (userAnswers[currentQuestionIndex] !== null) {
                return;
            }

            userAnswers[currentQuestionIndex] = index;

            if (
                index ===
                currentQuestions[currentQuestionIndex].answer
            ) {
                score++;
            }

            renderQuestion();
        }


        /* =========================================================
           Results
        ========================================================= */

        function showResults() {
            currentView = 'result';

            document.getElementById('question-container')
                .classList.add('hidden');

            document.getElementById('quiz-controls')
                .classList.add('hidden');

            document.getElementById('result-view')
                .classList.remove('hidden');

            document.getElementById('final-score').innerText =
                `${score} / ${currentQuestions.length}`;

            const wrongList =
                document.getElementById('wrong-questions-list');

            wrongList.innerHTML = '';

            let hasWrong = false;

            currentQuestions.forEach((question, index) => {
                if (userAnswers[index] === question.answer) {
                    return;
                }

                hasWrong = true;

                const questionText =
                    currentLang === 'zh'
                        ? question.questionZh
                        : question.questionEn;

                const options =
                    currentLang === 'zh'
                        ? question.optionsZh
                        : question.optionsEn;

                const explanation =
                    currentLang === 'zh'
                        ? question.explanationZh
                        : question.explanationEn;

                const userAnswerText =
                    userAnswers[index] !== null
                        ? options[userAnswers[index]]
                        : uiStrings[currentLang].unanswered;

                const correctAnswerText =
                    options[question.answer];

                const item =
                    document.createElement('div');

                item.className =
                    'bg-slate-50 p-5 rounded-xl border border-slate-200';

                const heading =
                    document.createElement('p');

                heading.className =
                    'font-bold text-slate-800 mb-2 text-lg whitespace-pre-line';

                heading.innerText =
                    `Q${currentGlobalOffset + index + 1}. ${questionText}`;

                item.appendChild(heading);

                const imageSource =
                    getQuestionImage(question);

                if (imageSource) {
                    const imageWrapper =
                        document.createElement('div');

                    imageWrapper.className =
                        'my-3 flex justify-center';

                    imageWrapper.innerHTML = `
                        <img src="${imageSource}"
                             alt="Question diagram"
                             class="max-w-full w-full max-h-64 object-contain rounded border border-slate-300 bg-white">
                    `;

                    item.appendChild(imageWrapper);
                }

                const optionsWrapper =
                    document.createElement('div');

                optionsWrapper.className =
                    'mt-3 mb-4 space-y-2';

                options.forEach((optionText, optionIndex) => {
                    const optionBox =
                        document.createElement('div');

                    optionBox.className =
                        'p-3 rounded-lg border text-sm flex items-start gap-3';

                    const letter =
                        String.fromCharCode(65 + optionIndex);

                    let iconHTML = `
                        <span class="flex-shrink-0 w-5 h-5 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center text-xs font-semibold">
                            ${letter}
                        </span>
                    `;

                    if (optionIndex === question.answer) {
                        optionBox.classList.add(
                            'bg-green-50',
                            'border-green-200',
                            'text-green-800',
                            'font-medium'
                        );

                        iconHTML = `
                            <span class="flex-shrink-0 w-5 h-5 rounded-full bg-green-200 text-green-700 flex items-center justify-center text-xs">
                                <i class="fas fa-check"></i>
                            </span>
                        `;
                    } else if (
                        optionIndex === userAnswers[index]
                    ) {
                        optionBox.classList.add(
                            'bg-red-50',
                            'border-red-200',
                            'text-red-800'
                        );

                        iconHTML = `
                            <span class="flex-shrink-0 w-5 h-5 rounded-full bg-red-200 text-red-700 flex items-center justify-center text-xs">
                                <i class="fas fa-times"></i>
                            </span>
                        `;
                    } else {
                        optionBox.classList.add(
                            'bg-white',
                            'border-slate-200',
                            'text-slate-600'
                        );
                    }

                    optionBox.innerHTML = iconHTML;

                    const optionSpan =
                        document.createElement('span');

                    optionSpan.innerText = optionText;

                    optionBox.appendChild(optionSpan);
                    optionsWrapper.appendChild(optionBox);
                });

                item.appendChild(optionsWrapper);

                const userAnswerLine =
                    document.createElement('p');

                userAnswerLine.className =
                    'text-rose-600 text-sm mb-1 font-medium';

                userAnswerLine.innerHTML =
                    `<i class="fas fa-times mr-1"></i> ${uiStrings[currentLang].yourAns}: `;

                userAnswerLine.appendChild(
                    document.createTextNode(userAnswerText)
                );

                item.appendChild(userAnswerLine);

                const correctAnswerLine =
                    document.createElement('p');

                correctAnswerLine.className =
                    'text-emerald-600 text-sm mb-3 font-medium';

                correctAnswerLine.innerHTML =
                    `<i class="fas fa-check mr-1"></i> ${uiStrings[currentLang].correctAns}: `;

                correctAnswerLine.appendChild(
                    document.createTextNode(correctAnswerText)
                );

                item.appendChild(correctAnswerLine);

                const explanationBox =
                    document.createElement('div');

                explanationBox.className =
                    'p-3 bg-sky-50 border border-sky-100 rounded-lg text-sky-800 text-sm';

                explanationBox.innerHTML = `
                    <div class="font-bold flex items-center gap-2 mb-1">
                        <i class="fas fa-info-circle"></i>
                        ${uiStrings[currentLang].explanation}
                    </div>

                    <div class="whitespace-pre-line leading-relaxed"></div>
                `;

                explanationBox
                    .querySelector('.whitespace-pre-line')
                    .innerText = explanation;

                item.appendChild(explanationBox);
                wrongList.appendChild(item);
            });

            if (hasWrong) {
                document.getElementById('wrong-questions-section')
                    .classList.remove('hidden');

                document.getElementById('download-wrong-buttons')
                    .classList.remove('hidden');
            } else {
                document.getElementById('wrong-questions-section')
                    .classList.add('hidden');

                document.getElementById('download-wrong-buttons')
                    .classList.add('hidden');
            }

            updateUI();
        }


        /* =========================================================
           Download Wrong Questions
        ========================================================= */

        function downloadWrongQuestionsTXT() {
            let content = '';
            let hasWrong = false;

            content +=
                currentLang === 'zh'
                    ? '錯題記錄\n'
                    : 'Incorrect Questions Record\n';

            content +=
                '========================================\n\n';

            currentQuestions.forEach((question, index) => {
                if (userAnswers[index] === question.answer) {
                    return;
                }

                hasWrong = true;

                const questionText =
                    currentLang === 'zh'
                        ? question.questionZh
                        : question.questionEn;

                const options =
                    currentLang === 'zh'
                        ? question.optionsZh
                        : question.optionsEn;

                const explanation =
                    currentLang === 'zh'
                        ? question.explanationZh
                        : question.explanationEn;

                const userAnswerText =
                    userAnswers[index] !== null
                        ? options[userAnswers[index]]
                        : uiStrings[currentLang].unanswered;

                const correctAnswerText =
                    options[question.answer];

                content +=
                    `Q${currentGlobalOffset + index + 1}. ${questionText}\n\n`;

                options.forEach((option, optionIndex) => {
                    content +=
                        `${String.fromCharCode(65 + optionIndex)}. ${option}\n`;
                });

                content +=
                    `\n${uiStrings[currentLang].yourAns}: ${userAnswerText}\n`;

                content +=
                    `${uiStrings[currentLang].correctAns}: ${correctAnswerText}\n`;

                content +=
                    `${uiStrings[currentLang].explanation}:\n${explanation}\n`;

                content +=
                    '----------------------------------------\n\n';
            });

            if (!hasWrong) {
                showModal(
                    uiStrings[currentLang].noWrongQuestions
                );

                return;
            }

            const blob = new Blob(
                [content],
                {
                    type: 'text/plain;charset=utf-8'
                }
            );

            const url =
                URL.createObjectURL(blob);

            const link =
                document.createElement('a');

            link.href = url;

            link.download =
                currentLang === 'zh'
                    ? '錯題記錄.txt'
                    : 'wrong_questions.txt';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function downloadWrongQuestionsPDF() {
            const wrongItems = Array.from(
                document.querySelectorAll('#wrong-questions-list > div')
            );

            if (wrongItems.length === 0) {
                showModal(uiStrings[currentLang].noWrongQuestions);
                return;
            }

            const pdfButton =
                document.getElementById('download-wrong-pdf-btn');

            const originalButtonHTML = pdfButton.innerHTML;
            let captureRoot = null;

            try {
                if (
                    !window.html2canvas ||
                    !window.jspdf ||
                    !window.jspdf.jsPDF
                ) {
                    throw new Error(
                        'PDF export libraries are unavailable.'
                    );
                }

                pdfButton.disabled = true;
                pdfButton.innerHTML =
                    `<i class="fas fa-spinner fa-spin"></i> <span>${uiStrings[currentLang].preparingPDF}</span>`;

                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }

                const { jsPDF } = window.jspdf;

                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4',
                    compress: true
                });

                const pageWidth =
                    pdf.internal.pageSize.getWidth();

                const pageHeight =
                    pdf.internal.pageSize.getHeight();

                const margin = 12;
                const imageWidth = pageWidth - (margin * 2);
                const availableHeight = pageHeight - (margin * 2);
                let isFirstPage = true;

                captureRoot = document.createElement('div');
                captureRoot.setAttribute('aria-hidden', 'true');
                captureRoot.style.cssText =
                    'position:fixed;left:-10000px;top:0;width:776px;background:#fff;pointer-events:none;';

                document.body.appendChild(captureRoot);

                for (const item of wrongItems) {
                    const capturePage =
                        document.createElement('div');

                    capturePage.style.cssText =
                        'width:776px;padding:28px;background:#fff;box-sizing:border-box;';

                    capturePage.appendChild(item.cloneNode(true));
                    captureRoot.appendChild(capturePage);

                    const images = Array.from(
                        capturePage.querySelectorAll('img')
                    );

                    await Promise.all(images.map(img => {
                        if (img.complete) {
                            return Promise.resolve();
                        }

                        return new Promise(resolve => {
                            img.addEventListener(
                                'load',
                                resolve,
                                { once: true }
                            );

                            img.addEventListener(
                                'error',
                                resolve,
                                { once: true }
                            );
                        });
                    }));

                    const canvas =
                        await window.html2canvas(capturePage, {
                            scale: 2,
                            useCORS: true,
                            backgroundColor: '#ffffff',
                            logging: false,
                            windowWidth: capturePage.scrollWidth,
                            windowHeight: capturePage.scrollHeight
                        });

                    captureRoot.removeChild(capturePage);

                    const pixelsPerMillimetre =
                        canvas.width / imageWidth;

                    const maxSliceHeight = Math.max(
                        1,
                        Math.floor(
                            availableHeight * pixelsPerMillimetre
                        )
                    );

                    for (
                        let sourceY = 0;
                        sourceY < canvas.height;
                        sourceY += maxSliceHeight
                    ) {
                        const sliceHeight = Math.min(
                            maxSliceHeight,
                            canvas.height - sourceY
                        );

                        const sliceCanvas =
                            document.createElement('canvas');

                        sliceCanvas.width = canvas.width;
                        sliceCanvas.height = sliceHeight;

                        const sliceContext =
                            sliceCanvas.getContext('2d');

                        sliceContext.fillStyle = '#ffffff';
                        sliceContext.fillRect(
                            0,
                            0,
                            sliceCanvas.width,
                            sliceCanvas.height
                        );

                        sliceContext.drawImage(
                            canvas,
                            0,
                            sourceY,
                            canvas.width,
                            sliceHeight,
                            0,
                            0,
                            canvas.width,
                            sliceHeight
                        );

                        if (!isFirstPage) {
                            pdf.addPage();
                        }

                        isFirstPage = false;

                        const renderedHeight =
                            sliceHeight / pixelsPerMillimetre;

                        pdf.addImage(
                            sliceCanvas.toDataURL(
                                'image/jpeg',
                                0.94
                            ),
                            'JPEG',
                            margin,
                            margin,
                            imageWidth,
                            renderedHeight,
                            undefined,
                            'FAST'
                        );
                    }
                }

                pdf.save(
                    currentLang === 'zh'
                        ? '錯題本.pdf'
                        : 'wrong_questions.pdf'
                );
            } catch (error) {
                console.error(error);
                showModal(uiStrings[currentLang].pdfDownloadError);
            } finally {
                if (captureRoot && captureRoot.parentNode) {
                    captureRoot.parentNode.removeChild(captureRoot);
                }

                pdfButton.disabled = false;
                pdfButton.innerHTML = originalButtonHTML;
            }
        }


        /* =========================================================
           Event Listeners
        ========================================================= */

        document.getElementById('back-btn').addEventListener('click', () => {
            if (currentView === 'sections') {
                showSubtopicsView();
            } else if (currentView === 'range') {
                const subtopic = subtopicsData.main.find(
                    item => item.id === currentSubtopicId
                );

                if (sectionsData[currentSubtopicId]) {
                    showSectionsView(subtopic);
                } else {
                    showSubtopicsView();
                }
            } else if (currentView === 'quiz' || currentView === 'result') {
                showRangeView(
                    currentRangeTargetId,
                    currentRangeTitleZh,
                    currentRangeTitleEn
                );
            }
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                const unansweredCount =
                    userAnswers.filter(ans => ans === null).length;

                if (unansweredCount > 0) {
                    const msg = uiStrings[currentLang].confirmFinish
                        .replace('{unanswered}', unansweredCount);

                    if (!confirm(msg)) {
                        return;
                    }
                }

                showResults();
            }
        });


        /* =========================================================
           Initialization
        ========================================================= */

        document.addEventListener('DOMContentLoaded', () => {
            document.documentElement.lang = 'zh-HK';
            updateUI();
            showSubtopicsView();
        });

    </script>
